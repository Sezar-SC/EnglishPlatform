<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>English Platform</h1>
    <p class="subtitle">Words. Listen. Play.</p>
  </header>

  <main id="app">
    <section id="level-select">
      <h2>Level</h2>
      <div class="button-row">
        <button data-level="a1">A1</button>
        <button data-level="a2">A2</button>
        <button data-level="b1">B1</button>
        <button data-level="b2">B2</button>
        <button data-level="c1">C1</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
